name: adbd Build (Android 6)
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://android.googlesource.com/platform/manifest'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'android-6.0.1_r79'
      DEVICE_ARCH:
        description: 'DEVICE_ARCH'
        required: true
        default: 'arm'
      DEBUG:
        description: 'Give me a shell to customize my adbd'
        required: true
        default: false
        type: boolean

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04
      options: --privileged
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Arch: ${{ github.event.inputs.DEVICE_ARCH }}"
        echo "Debug: ${{ github.event.inputs.DEBUG }}"
        echo "::endgroup::"

    - name: Install Node.js 12 (compatible with Ubuntu 18.04)
      run: |
        apt-get update
        curl -sL https://deb.nodesource.com/setup_12.x | bash -
        apt-get install -y nodejs
        node --version
        npm --version

    - name: Check Out
      uses: actions/checkout@v3

    - name: Prepare the environment
      run: |
        apt-get update
        apt-get install -y software-properties-common
        add-apt-repository ppa:openjdk-r/ppa -y
        apt-get update
        apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2-minimal bash cpio openjdk-7-jdk
        ln -sf /usr/bin/python2 /usr/bin/python
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        ln -sf ~/bin/repo /usr/bin/repo
        echo "JAVA_HOME=/usr/lib/jvm/java-7-openjdk-amd64" >> $GITHUB_ENV

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Tmate SSH - Customize your adbd
      if: ${{ github.event.inputs.DEBUG == 'true' }}
      uses: mxschmitt/action-tmate@v3.13

    - name: Building adbd
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch aosp_${{ github.event.inputs.DEVICE_ARCH }}-eng
        make clean
        make adbd -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Find adbd_auth.cpp and create path file
      run: |
        # 查找adbd_auth.cpp文件
        find ${{ steps.pwd.outputs.workspace-folder }} -name "adbd_auth.cpp" > adbd_auth_path.txt
        
        # 如果找到文件，复制到当前目录
        if [ -s adbd_auth_path.txt ]; then
          AUTH_PATH=$(head -n 1 adbd_auth_path.txt)
          cp "$AUTH_PATH" .
        else
          echo "adbd_auth.cpp not found" > adbd_auth_path.txt
        fi
        
        # 复制adbd二进制文件
        cp ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/generic/root/sbin/adbd .
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/adbd
          ${{ steps.pwd.outputs.workspace-folder }}/adbd_auth.cpp
          ${{ steps.pwd.outputs.workspace-folder }}/adbd_auth_path.txt
        name: ${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Arch: ${{ github.event.inputs.DEVICE_ARCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}