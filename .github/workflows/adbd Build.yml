name: adbd Build
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://android.googlesource.com/platform/manifest'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'android-10.0.0_r47'
      DEVICE_ARCH:
        description: 'DEVICE_ARCH'
        required: true
        default: 'arm'  
      DEBUG:
        description: 'Give me a shell to customize my adbd'
        required: true
        default: false
        type: boolean
jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Arch: ${{ github.event.inputs.DEVICE_ARCH }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev \
            libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev \
            lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        check-latest: false

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
              ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "azwhikaru"
        git config --global user.email "azwhikaru+37921907@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Modify adbd_auth.cpp
      run: |
        find workspace -type f -name 'adbd_auth.cpp' -exec sed -i 's/bool adbd_auth_verify(const char\* token, size_t token_size, const char\* sig, int sig_len) {/bool adbd_auth_verify(const char\* token, size_t token_size, const char\* sig, int sig_len) {\n    return true;/' {} +

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Shell APEX
      run: |
        export JAVA_HOME=${{ env.JAVA_HOME }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch aosp_${{ github.event.inputs.DEVICE_ARCH }}-eng
        
        # 直接构建Shell APEX而不指定依赖
        make com.android.shell -j$(nproc --all)
        
        # 如果失败，尝试构建整个adb模块
        if [ $? -ne 0 ]; then
            echo "Building adb module instead..."
            make adb -j$(nproc --all)
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Find APEX files
      run: |
        echo "::group::Searching for APEX files"
        find ${{ steps.pwd.outputs.workspace-folder }}/out/target/product -name "com.android.shell*.apex" -print
        echo "::endgroup::"
        
        # 创建包含APEX文件的目录
        mkdir -p apex_output
        find ${{ steps.pwd.outputs.workspace-folder }}/out/target/product -name "com.android.shell*.apex" -exec cp {} apex_output/ \;
        
        # 如果没有找到APEX文件，尝试查找adbd二进制文件
        if [ ! -d "apex_output" ] || [ -z "$(ls -A apex_output)" ]; then
            echo "::group::Searching for adbd files"
            find ${{ steps.pwd.outputs.workspace-folder }}/out/target/product -name "adbd" -print
            echo "::endgroup::"
            
            mkdir -p adbd_output
            find ${{ steps.pwd.outputs.workspace-folder }}/out/target/product -name "adbd" -exec cp {} adbd_output/ \;
            echo "ARTIFACT_FOLDER=adbd_output" >> $GITHUB_ENV
            echo "ARTIFACT_TYPE=adbd" >> $GITHUB_ENV
        else
            echo "ARTIFACT_FOLDER=apex_output" >> $GITHUB_ENV
            echo "ARTIFACT_TYPE=apex" >> $GITHUB_ENV
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_TYPE }}_${{ github.event.inputs.MANIFEST_BRANCH }}_${{ github.event.inputs.DEVICE_ARCH }}
        path: ${{ env.ARTIFACT_FOLDER }}
        retention-days: 1